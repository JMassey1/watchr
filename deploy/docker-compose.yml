# GitHub Actions publishes the production images and deploys this stack.
# Runtime configuration is supplied from the production host's .env file.

name: watch3r-${DEPLOY_ENV:-production}

services:
  # Apply the schema before the production server starts.
  migrate:
    image: ${REGISTRY:-ghcr.io/jmassey1}/watch3r-server:${IMAGE_TAG:-production}
    working_dir: /app/packages/db
    command: ["bun", "run", "db:push"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/watch3r
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ${REGISTRY:-ghcr.io/jmassey1}/watch3r-server:${IMAGE_TAG:-production}
    container_name: watch3r-${DEPLOY_ENV:-production}-server
    init: true
    ports:
      - "127.0.0.1:${SERVER_PORT:-13000}:3000"
    environment:
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required (min 32 chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/watch3r
      # Server-internal S3 API endpoint (container network, not host-mapped).
      S3_ENDPOINT: http://minio:9000
      # S3 API host the BROWSER uses to run presigned uploads (host-mapped port).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET:-watch3r-avatars}
      S3_COVERS_BUCKET: ${S3_COVERS_BUCKET:-watch3r-covers}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Public URL browsers use to load images (host-mapped MinIO port).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:?TMDB_API_READ_ACCESS_TOKEN is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    # GitHub Actions bakes the production API URL into this image.
    image: ${REGISTRY:-ghcr.io/jmassey1}/watch3r-web:${IMAGE_TAG:-production}
    container_name: watch3r-${DEPLOY_ENV:-production}-web
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-13001}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: watch3r-${DEPLOY_ENV:-production}-postgres
    environment:
      POSTGRES_DB: watch3r
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: watch3r-${DEPLOY_ENV:-production}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: create the avatars and covers buckets and make them public-read.
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_AVATARS_BUCKET:-watch3r-avatars};
      mc anonymous set download local/${S3_AVATARS_BUCKET:-watch3r-avatars};
      mc mb --ignore-existing local/${S3_COVERS_BUCKET:-watch3r-covers};
      mc anonymous set download local/${S3_COVERS_BUCKET:-watch3r-covers};
      echo 'MinIO buckets ready';
      "
    restart: "no"

volumes:
  postgres_data:
    name: watch3r_${DEPLOY_ENV:-production}_postgres_data
  minio_data:
    name: watch3r_${DEPLOY_ENV:-production}_minio_data
