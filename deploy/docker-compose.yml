# watch3r deploy stack (registry-image based, per-environment).
#
# This file is consumed by Portainer as a Git-based stack. It never builds
# images — CI (.forgejo/workflows/deploy-test.yml) builds and pushes them to
# the Forgejo container registry, and Portainer pulls them by tag.
#
# Everything environment-specific (ports, URLs, secrets, image tag) is supplied
# via the Portainer stack's environment variables. See deploy/test.env.example
# for the full list and the values for the `test` region.
#
# The same file serves any region: create one Portainer stack per environment
# (test, prod, ...) each pointing at this path with its own env vars.

name: watch3r-${DEPLOY_ENV:-test}

services:
  # One-shot schema sync. Reuses the server image (which contains drizzle-kit,
  # since the server Dockerfile does a full, unpruned `bun install`). Runs
  # `drizzle-kit push` against Postgres, then exits. The server waits for this
  # to complete successfully before starting.
  #
  # NOTE: push-based sync is intentional for the test region. Before a prod
  # region, switch to `drizzle-kit generate` + a programmatic migrator.
  migrate:
    image: ${REGISTRY:-orbiter.taild7aa61.ts.net/jordan}/watch3r-server:${IMAGE_TAG:-test}
    working_dir: /app/packages/db
    command: ["bun", "run", "db:push"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/watch3r
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: ${REGISTRY:-orbiter.taild7aa61.ts.net/jordan}/watch3r-server:${IMAGE_TAG:-test}
    container_name: watch3r-${DEPLOY_ENV:-test}-server
    init: true
    ports:
      - "${SERVER_PORT:-13000}:3000"
    environment:
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required (min 32 chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/watch3r
      # Server-internal S3 API endpoint (container network, not host-mapped).
      S3_ENDPOINT: http://minio:9000
      # S3 API host the BROWSER uses to run presigned uploads (host-mapped port).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET:-watch3r-avatars}
      S3_COVERS_BUCKET: ${S3_COVERS_BUCKET:-watch3r-covers}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Public URL browsers use to load images (host-mapped MinIO port).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:?TMDB_API_READ_ACCESS_TOKEN is required}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    # VITE_SERVER_URL is baked into this image at build time by CI, so the web
    # image is region-specific. There is nothing to configure here at runtime.
    image: ${REGISTRY:-orbiter.taild7aa61.ts.net/jordan}/watch3r-web:${IMAGE_TAG:-test}
    container_name: watch3r-${DEPLOY_ENV:-test}-web
    init: true
    ports:
      - "${WEB_PORT:-13001}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: watch3r-${DEPLOY_ENV:-test}-postgres
    environment:
      POSTGRES_DB: watch3r
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: watch3r-${DEPLOY_ENV:-test}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: create the avatars and covers buckets and make them public-read.
  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${S3_AVATARS_BUCKET:-watch3r-avatars};
      mc anonymous set download local/${S3_AVATARS_BUCKET:-watch3r-avatars};
      mc mb --ignore-existing local/${S3_COVERS_BUCKET:-watch3r-covers};
      mc anonymous set download local/${S3_COVERS_BUCKET:-watch3r-covers};
      echo 'MinIO buckets ready';
      "
    restart: "no"

volumes:
  postgres_data:
    name: watch3r_${DEPLOY_ENV:-test}_postgres_data
  minio_data:
    name: watch3r_${DEPLOY_ENV:-test}_minio_data
